# OpenTrace indicator classes and concept families for landing datapoint reports.
# Patterns are tried in order against "dataset table" and then against raw indicator text.
# The first match wins. One family per table.

classes:
  EL:
    name: Economic & Livelihood
    opentrace_definition: Economic activities and livelihood-related conditions associated with agriculture and the wider agricultural ecosystem.
    operational_definition: Employment, income, wages, labour productivity, economic security, dependence on agricultural and agrifood activities; forms and conditions of work.
  GYI:
    name: Gender, Youth & Inclusion
    opentrace_definition: Roles, opportunities, access, participation and outcomes of people of different genders, ages and social groups within agriculture and agrifood systems.
    operational_definition: Ownership and control of resources, access to services and economic opportunities, decision-making, representation; youth participation; inclusion metrics.
  FVC:
    name: Food System & Value Chain
    opentrace_definition: Actors, activities, capacities and outcomes that produce, transform, distribute and consume agricultural and food products, including value creation and loss.
    operational_definition: Value added, processing, storage, post-harvest loss, food waste, market access, trade in raw/processed products, agro-processing employment.
  FS:
    name: Food Security & Nutrition
    opentrace_definition: Availability, access, utilization and stability of food; acute and chronic food insecurity; dietary energy and nutritional outcomes.
    operational_definition: IPC/CH phases, food-insecure population, FIES, dietary energy, self-sufficiency, food availability and access indicators.
  PROD:
    name: Agricultural Production
    opentrace_definition: Physical production of crops and livestock, area harvested, yields, production systems and seasonal outcomes.
    operational_definition: Production quantity, area, yield, crop production system, planting/harvest timing, livestock output.
  PRC:
    name: Prices & Markets
    opentrace_definition: Prices of agricultural commodities and food products, market structure, and cross-border trade flows.
    operational_definition: Producer/consumer/retail prices, staple status, trade flows, border points, currencies and units.
  CLIM:
    name: Climate & Weather
    opentrace_definition: Climate and weather conditions affecting agricultural systems and health outcomes.
    operational_definition: Temperature, radiation, precipitation-related proxies, climate-health impact indicators.
  SOIL:
    name: Soil Health & Land
    opentrace_definition: Physical and chemical soil properties, land use/cover, degradation and land-related sustainability.
    operational_definition: Texture, pH, SOC, nutrients, bulk density, CEC, land cover/use, degradation indicators, AEZ.
  AH:
    name: Animal Health & Livestock
    opentrace_definition: Livestock health, disease, treatments, practices and related productivity outcomes.
    operational_definition: Clinical disease scores, incidence, mortality, acaricide/AMU use, herd size, treatment costs.
  VEG:
    name: Vegetation & Feed
    opentrace_definition: Vegetation status, biomass, feed resources and related carrying capacity.
    operational_definition: NDVI, tree/shrub/grass quantity and palatability, carrying capacity, grazing presence.
  ENV:
    name: Environment & Emissions
    opentrace_definition: Greenhouse gas emissions and environmental pressures from agrifood systems.
    operational_definition: Farm-gate crop/livestock/energy emissions, land-use change, fires, forests, emission intensities.
  HDI:
    name: Human Development & Socio-economic
    opentrace_definition: Broader human development and socio-economic context relevant to agricultural livelihoods.
    operational_definition: HDI, GDP/PPP, air quality and related socio-economic series.
  BIO:
    name: Biodiversity & Germplasm
    opentrace_definition: Biological diversity, species occurrence and genetic resources relevant to agriculture.
    operational_definition: GBIF occurrences, protected areas, crop germplasm accessions, rarity layers.
  RES:
    name: Research & Innovation
    opentrace_definition: Research projects, organisations and persons in agriculture and environment.
    operational_definition: OpenAIRE projects, organisations, persons, funding and linkages.
  INP:
    name: Agricultural Inputs
    opentrace_definition: Use and trade of fertilizers, pesticides, manure and related input intensities.
    operational_definition: Fertilizer by nutrient/product, pesticide use/trade, livestock manure, nutrient balances.

families:
  EL-01:
    class_id: EL
    concept_family: Agricultural employment share — total
    measurement_forms: ILO modelled %; survey/census counts
  EL-02:
    class_id: EL
    concept_family: Agrifood systems employment structure
    measurement_forms: Shares by AFS sub-industry; sex breakdown
  EL-03:
    class_id: EL
    concept_family: Agricultural labour productivity & earnings
    measurement_forms: Value added per worker; hourly earnings; hours worked
  EL-04:
    class_id: EL
    concept_family: Household income & livelihood composition
    measurement_forms: Total/farm/off-farm income; FIES; food self-sufficiency
  GYI-01:
    class_id: GYI
    concept_family: Land ownership and secure rights by sex
    measurement_forms: Agricultural land ownership; alone/joint forms; legal guarantees
  GYI-02:
    class_id: GYI
    concept_family: Gender gaps in agrifood employment
    measurement_forms: Shares and gaps by sex in AFS and agriculture
  GYI-03:
    class_id: GYI
    concept_family: Access to finance, digital and services by sex
    measurement_forms: Bank account; internet use; extension/credit proxies
  GYI-04:
    class_id: GYI
    concept_family: Household gender control & decision-making
    measurement_forms: Male/female/youth control scores from surveys
  FVC-01:
    class_id: FVC
    concept_family: Agricultural sector value added
    measurement_forms: "% GDP; current US$; constant US$; real growth; per worker"
  FVC-02:
    class_id: FVC
