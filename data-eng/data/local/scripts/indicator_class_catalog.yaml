    concept_family: Crop and livestock production
    measurement_forms: Production qty; area harvested; yield
  PROD-02:
    class_id: PROD
    concept_family: Dairy genetics and milk output
    measurement_forms: Milk yield; calving; parity
  PRC-01:
    class_id: PRC
    concept_family: Commodity market prices
    measurement_forms: Price level; common unit/currency price; price type
  PRC-02:
    class_id: PRC
    concept_family: Cross-border trade flows
    measurement_forms: Flow type; quantity; border point
  CLIM-01:
    class_id: CLIM
    concept_family: Agrometeorological conditions
    measurement_forms: Radiation; temperature proxies; elevation
  CLIM-02:
    class_id: CLIM
    concept_family: Climate-health impacts
    measurement_forms: Modelled health impact indicators
  SOIL-01:
    class_id: SOIL
    concept_family: Soil physical and chemical properties
    measurement_forms: Clay/sand/silt; pH; SOC; N; CEC; bulk density; nutrients
  SOIL-02:
    class_id: SOIL
    concept_family: Land use, cover and degradation
    measurement_forms: Land use/cover; UNCCD degradation series
  SOIL-03:
    class_id: SOIL
    concept_family: Agro-ecological zones
    measurement_forms: AEZ code/name/share
  AH-01:
    class_id: AH
    concept_family: Livestock disease and clinical outcomes
    measurement_forms: Clinical scores; incidence; mortality; positive cases
  AH-02:
    class_id: AH
    concept_family: Veterinary practices and AMU
    measurement_forms: Acaricide use; treatment cost; application mode
  AH-03:
    class_id: AH
    concept_family: Foodborne hazards
    measurement_forms: Hazard type; prevalence; samples
  VEG-01:
    class_id: VEG
    concept_family: Vegetation indices and biomass
    measurement_forms: NDVI; tree/shrub/grass quantity; carrying capacity
  ENV-01:
    class_id: ENV
    concept_family: Agrifood systems emissions
    measurement_forms: Farm-gate; land-use change; totals; intensities
  INP-01:
    class_id: INP
    concept_family: Fertilizer use and trade
    measurement_forms: By nutrient/product; trade matrix
  INP-02:
    class_id: INP
    concept_family: Pesticide use and trade
    measurement_forms: Use; trade
  HDI-01:
    class_id: HDI
    concept_family: Human Development Index
    measurement_forms: HDI value by country-year
  HDI-02:
    class_id: HDI
    concept_family: GDP and macro context
    measurement_forms: GDP PPP and related
  BIO-01:
    class_id: BIO
    concept_family: Species occurrence and rarity
    measurement_forms: GBIF occurrence; rarity birds
  BIO-02:
    class_id: BIO
    concept_family: Protected areas and germplasm
    measurement_forms: Protected area extent; crop germplasm
  RES-01:
    class_id: RES
    concept_family: Agricultural research projects
    measurement_forms: Projects, funding, organisations, persons

# First match wins. Price tables stay PRC, not also FVC-03.
