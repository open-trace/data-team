common_columns:
  geo_key:
    role: FK
    description: Conformed geography key linking this row to int_geography_conformed.
      Use this join key for place-level analysis; may be null when geo attach fails
      (often warn-severity in tests).
  geo_level:
    role: dim
    description: 'Geographic grain of the place row: country, admin1, admin2, city,
      or fnid. Filter on geo_level before aggregating across unlike place grains.'
  country_iso3:
    role: dim
    description: ISO 3166-1 alpha-3 country code. Enables consistent country filtering
      and joins to int_ref_country / int_geography_conformed even when geo_key is
      unmatched.
  country_iso2:
    role: dim
    description: ISO 3166-1 alpha-2 country code. Often used as a bridge from FEWS
      or city sources before resolving ISO3 via int_ref_country.
  country_name:
    role: dim
    description: Human-readable country name as provided by the upstream source or
      conformed reference. Prefer country_iso3 for joins; use country_name for display
      and fuzzy matching.
  country:
    role: dim
    description: Country label from the source feed (may be name or code depending
      on upstream). Normalize via int_ref_country or int_geography_conformed before
      cross-source compares.
  admin_1_name:
    role: dim
    description: First-level administrative division name (state/region/province)
      when present on the source.
  admin_2_name:
    role: dim
    description: Second-level administrative division name (district/zone) when present
      on the source.
  city_name:
    role: dim
    description: City or locality name for city-grain geography rows.
  fnid:
    role: dim
    description: FEWS NET livelihood / admin unit identifier used as a subnational
      place key. Join to int_geography_conformed where geo_level = fnid.
  latitude:
    role: dim
    description: Latitude in decimal degrees for point or city observations.
  longitude:
    role: dim
    description: Longitude in decimal degrees for point or city observations.
  source_natural_key:
    role: dim
    description: Stable natural key for the producing dataset (e.g. faostat_crops,
      fews_fs). Joins to int_source_registry for ACF Path B producer metadata (tier,
      data_level).
  source_key:
    role: FK
    description: Surrogate or conformed source key used downstream in mart dims; aligns
      with lineage carried from intermediate into mart_dev.
  area_code:
    role: dim
    description: FAOSTAT area code identifying the geographic reporting unit. Resolve
      to ISO via int_faostat_area_reference / int_faostat_area_iso before country
      joins.
  item_code:
    role: dim
    description: FAOSTAT item (commodity/product) code for the measure row.
  element_code:
    role: dim
    description: FAOSTAT element code identifying the measure type (production, area
      harvested, yield, etc.).
  year:
    role: dim
    description: Calendar year of the observation or reporting period.
  month:
    role: dim
    description: Calendar month (1–12) of the observation when the source is monthly.
  value:
    role: measure
    description: Primary numeric measure for this conformed fact row. Interpret together
      with unit and any grain discriminator (production_grain, measure_type, price_source,
      etc.).
  unit:
    role: measure
    description: Unit of measure for value (tonnes, people, USD, index points, etc.).
  loaded_at:
    role: meta
    description: Pipeline load timestamp when the intermediate row was materialized.
  native_id:
    role: dim
    description: Source-native identifier for the place or entity (city id, FNID,
      ISO3, etc.) used when building geo_key uniqueness.
  in_africa_scope:
    role: dim
    description: Boolean flag indicating the country is in OpenTrace Africa analysis
      scope (from int_ref_country / M49 + geo seed).
  production_grain:
    role: dim
    description: 'Discriminator for FAOSTAT production long-form rows: physical, index,
      or gross_value. Filter production_grain before comparing quantities across elements.'
  measure_type:
    role: dim
    description: 'Food-security product type: population counts versus classification
      phases. Never union population and classification metrics without an explicit
      grain caveat.'
  price_value:
    role: measure
    description: Observed or reported market price amount after harmonisation.
  price_source:
    role: dim
    description: 'Price feed origin after harmonisation: fews, wfp, or faostat. Keep
      price_source when comparing volatility across markets.'
  measurement_form:
    role: dim
    description: Macro indicator form (share_of_gdp, annual_growth, constant_price,
      current_price). Filter before charting FAOSTAT macro series.
  soil_property:
    role: dim
    description: Soil attribute name in long-form soil tables (e.g. organic carbon,
      pH, texture class).
  depth_band:
    role: dim
    description: Soil sampling depth interval label for the property value.
  season_key:
    role: FK
    description: Normalized season identifier for yield/season calendars.
  season_country_key:
    role: FK
    description: Composite season × country key used to attach yield rows to int_season_mapped.
  season_name:
    role: dim
    description: Human-readable agricultural season name from the yield source.
  tier:
    role: acf
    description: ACF producer-scale tier (1=global, 2=national ministry, 3=community
      survey).
  data_level:
    role: acf
    description: ACF warehouse resolution of the number (global, national, sub_national,
      community, point).
  organisation_name:
    role: dim
    description: Producing organisation name in the source registry.
  default_data_level:
    role: acf
    description: Default ACF data_level for this source_natural_key in int_source_registry.
  producer_scale:
    role: acf
    description: Producer scale band (global, regional, national, subnational) for
      ACF scoring.
  match_method:
    role: dim
    description: 'How FAOSTAT area_code was mapped to a country: m49, ref_country_name,
      or alias. Null when unmatched.'
  product:
    role: dim
    description: Crop or commodity name from the yield/production source feed.
  population:
    role: measure
    description: Population count associated with the place or survey unit when provided
      by the source.
column_overrides:
  int_geography_conformed:
    geo_key:
      role: PK
      description: Primary place key for the OpenTrace intermediate geography spine.
        Uniqueness is enforced with source_natural_key and native_id. All with_geo
        intermediate facts should join here on geo_key.
      example: geo_eth_fnid_ETR103
  int_source_registry:
    source_natural_key:
      role: PK
      description: Primary key of the ACF Path B source registry. One row per producing
        dataset with organisation, tier, default_data_level, and producer_scale.
      example: faostat_crops
  int_ref_country:
    country_iso3:
      role: PK
      description: Canonical ISO3 country code for Africa-scoped reference countries
        (stg_geo + M49 seed). Use as the authoritative country list for filters.
      example: KEN
