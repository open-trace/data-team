# dbt project: OpenTrace transform-v2
# Contract: raw_dev is the primordial source (ingest writes landing_dev + raw_dev).
# Pipeline: raw_dev → staging_dev → intermediate_dev → mart_dev
# BigQuery dataset IDs match folder names; override with BQ_DATASET_* env vars.
# Run with: dbt run --target raw_dev | staging_dev | intermediate_dev | mart_dev
# Version tags: transform-vX.Y.Z (see data-eng/README.md). Baseline: transform-v1.0.0

name: open_trace
version: "2.0.0"
config-version: 2
profile: open_trace

# models/ = hand SQL + hand sources; catalog/ = generated sources.generated.yml
model-paths: ["models", "catalog"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Datasets (from env; env names keep BQ_DATASET_BRONZE etc. for backwards compatibility)
  landing_dataset: "{{ env_var('BQ_DATASET_LANDING', 'landing') }}"
  raw_dev_dataset: "{{ env_var('BQ_DATASET_BRONZE', 'raw_dev') }}"
  staging_dev_dataset: "{{ env_var('BQ_DATASET_SILVER', 'staging_dev') }}"
  intermediate_dev_dataset: "{{ env_var('BQ_DATASET_INTERMEDIATE', 'intermediate_dev') }}"
  mart_dev_dataset: "{{ env_var('BQ_DATASET_GOLD', 'mart_dev') }}"

seeds:
  open_trace:
    ref_m49_country:
      +column_types:
        m49_code: string
        in_africa_scope: boolean
    ref_faostat_aggregate_areas:
      +column_types:
        area_code: string

models:
  open_trace:
    landing:
      +schema: "{{ env_var('BQ_DATASET_LANDING', 'landing') }}"
      +database: "{{ env_var('BQ_PROJECT', 'your-gcp-project-id') }}"
    raw_dev:
      +schema: "{{ env_var('BQ_DATASET_BRONZE', 'raw_dev') }}"
      +database: "{{ env_var('BQ_PROJECT', 'your-gcp-project-id') }}"
    staging_dev:
      +schema: "{{ env_var('BQ_DATASET_SILVER', 'staging_dev') }}"
      +database: "{{ env_var('BQ_PROJECT', 'your-gcp-project-id') }}"
    intermediate_dev:
      +schema: "{{ env_var('BQ_DATASET_INTERMEDIATE', 'intermediate_dev') }}"
      +database: "{{ env_var('BQ_PROJECT', 'your-gcp-project-id') }}"
    mart_dev:
      +schema: "{{ env_var('BQ_DATASET_GOLD', 'mart_dev') }}"
      +database: "{{ env_var('BQ_PROJECT', 'your-gcp-project-id') }}"
