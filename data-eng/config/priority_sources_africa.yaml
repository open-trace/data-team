    current_countries:
      - KE  # Kenya
      - NG  # Nigeria
      - ET  # Ethiopia
      - GH  # Ghana
    target_countries:
      - TZ  # Tanzania
      - UG  # Uganda
      - RW  # Rwanda
      - MW  # Malawi
      - ZM  # Zambia
      - ZW  # Zimbabwe
      - BF  # Burkina Faso
      - ML  # Mali
      - SN  # Senegal
