version: "2026.8"
# Curated reasoner semantics for mart_dev tables (merged into bq_mart_tables_yaml_files by patch_mart_yaml_semantics.py).
# P0 = full curation; remaining tables get auto-baseline from mart_entity_dictionary_seed.yaml.

tables:
  fct_production:
    indicator_classes: [PROD]
    semantic_role:
      primary_domain: production
      supports: [production, faostat, PROD]
    indicator_families:
      - id: faostat_country_year_physical
        filters: "production_grain='physical'; filter metric or element for volume"
      - id: faostat_index_gross_value
        filters: "production_grain in ('index','gross_value')"
    business_questions_supported:
      - What is national crop production by country and year?
      - Which country produced the most maize in a given year?
    filtering_guidance:
      - Always filter production_grain — never mix physical, index, gross_value in one SUM
      - Default volume questions to production_grain='physical'
      - Filter country_iso3 or join dim_geography for country names; never filter place_scope ARRAY with =
      - Filter as_of_date or year for time-bounded questions
      - Prefer metric slug when present; else filter element exactly
      - Never UNION with fct_yield — different grain
    sql_generation_hints:
      - "National ranking: production_grain='physical'; GROUP BY country_iso3, year; SUM(production_qty) or value column"
      - LEFT JOIN dim_geography g ON f.geography_key = g.geography_key WHEN filtering by country name
      - Prefer agg_production_annual for national annual rollups
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}
        - {table: dim_product, on: [product_key], how: LEFT}
      do_not_join:
        - {table: fct_yield, reason: Different grain — compare only}

  fct_yield:
    indicator_classes: [PROD]
    semantic_role:
      primary_domain: production
      supports: [yield, PROD]
    indicator_families:
      - id: fnid_season_yield
        filters: season_key / harvest_year; subnational FNID grain
    business_questions_supported:
      - What is maize yield by season and FNID?
    filtering_guidance:
      - Subnational seasonal grain — not comparable to fct_production national totals
      - Filter harvest_year, season_key, country_iso3
    sql_generation_hints:
      - Yield = production / area when computing from components; use yield column when present
    semantic_relationships:
      do_not_join:
        - {table: fct_production, reason: FAOSTAT national vs FNID-season}

  fct_prices:
    indicator_classes: [PRC, FVC]
    semantic_role:
      primary_domain: prices
      supports: [prices, market_price, PRC]
    indicator_families:
      - id: fews_market
        filters: "price_source='fews'"
      - id: wfp_market
        filters: "price_source='wfp'"
      - id: faostat_national
        filters: "price_source='faostat'"
    business_questions_supported:
      - What is the retail maize price in a market/country/month?
    filtering_guidance:
      - Always filter price_source (fews/wfp/faostat) — do not blend
      - Filter price_type (Retail/Wholesale/Producer) when question specifies
      - common_unit_price null on WFP/FAOSTAT is expected
      - Month must be calendar 1-12
    sql_generation_hints:
      - JOIN dim_market for market names; dim_geography for country labels
      - Prefer agg_prices_country_month for country monthly rollups

  fct_trade:
    indicator_classes: [FVC]
    semantic_role:
      primary_domain: trade
      supports: [trade, FVC]
    filtering_guidance:
      - Always filter trade_grain before analysis
      - FEWS border month vs FAOSTAT country-year — never blend silently
    sql_generation_hints:
      - Filter trade_grain='fews_border_month' or 'faostat_country_year' per question

  fct_food_security:
    indicator_classes: [FS]
    semantic_role:
      primary_domain: food_security
      supports: [food_security, ipc, FS]
    indicator_families:
      - id: ipc_population
        filters: "measure_type='population'"
      - id: ipc_classification
        filters: "measure_type='classification'"
    business_questions_supported:
      - How many people are in IPC phase 3+?
      - What is the IPC classification for a district?
    filtering_guidance:
      - Population vs classification rows — never UNION
      - Filter scenario_name for outlook vs current
      - JOIN dim_classification for phase labels
    sql_generation_hints:
      - Prefer agg_food_security_monthly for national monthly rollups

  fct_food_balance:
    indicator_classes: [FS, FVC]
    semantic_role:
      primary_domain: food_balance
      supports: [food_balance, FS, FVC]
    filtering_guidance:
      - Filter element_code for food vs feed vs losses
      - Losses are SUA disappearance not farm-gate waste

  fct_climate:
    indicator_classes: [CLIM]
    semantic_role:
      primary_domain: climate
      supports: [climate, CLIM]
    filtering_guidance:
      - Filter climate_grain (point_obs vs country_model)
      - JOIN dim_indicator for named climate series
    sql_generation_hints:
      - Filter metric + as_of_date range for time series

  fct_employment:
    indicator_classes: [EL, GYI]
    semantic_role:
      primary_domain: employment
      supports: [employment, EL, GYI]
    filtering_guidance:
      - JOIN dim_indicator for indicator_name labels
      - Do not mix unit='%' with headcount in one SUM
      - Filter sex when question specifies gender

  fct_economics:
    indicator_classes: [EL, FVC, HDI]
    semantic_role:
      primary_domain: economics
      supports: [economics, gdp, EL, HDI]
    filtering_guidance:
      - Filter measurement_form (share_of_gdp vs current USD)
      - country_iso3 + year for national macro

  fct_hdi:
    indicator_classes: [HDI]
    semantic_role:
      primary_domain: hdi
      supports: [hdi, HDI]
    filtering_guidance:
      - Country-year only; skip null geography_key rows for mapped insights
      - Prefer agg_hdi_latest for snapshots

  fct_household:
    indicator_classes: [EL, GYI, FS]
    semantic_role:
      primary_domain: household
      supports: [household, FS, GYI]
    filtering_guidance:
      - Survey sample — not national census
      - Never union with fct_gender_inclusion SDG rows

  agg_production_annual:
    indicator_classes: [PROD]
    semantic_role:
      primary_domain: production
      supports: [production, PROD]
    filtering_guidance:
      - Prefer for national annual production rollups
      - production_grain='physical' for volume questions
    sql_generation_hints:
      - JOIN dim_geography, dim_product, dim_source on FK keys

  agg_production_country_year:
    indicator_classes: [PROD]
    semantic_role:
      primary_domain: production
      supports: [production, faostat, PROD]
    business_questions_supported:
      - What was national crop production by country and year?
      - Kenya rice / staple production panel questions
    filtering_guidance:
      - Default national production panel table (physical grain only)
      - Filter country_iso3 or country_name; JOIN dim_product for crop name literals
      - Group by source_key when comparing producers
      - Do not mix with agg_production_country_season without stating grain
      - Prefer over fct_production for country-year volume rollups
    sql_generation_hints:
      - LEFT JOIN dim_product p ON f.product_key = p.product_key; filter p.product_name
      - LEFT JOIN dim_geography g ON f.geography_key = g.geography_key for country labels
      - SUM production qty / area columns; filter year when question is time-bounded
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}
        - {table: dim_product, on: [product_key], how: LEFT}
        - {table: dim_source, on: [source_key], how: LEFT}

  fct_land_inputs:
    indicator_classes: [INP, SOIL]
    semantic_role:
      primary_domain: production
      supports: [land_inputs, fertilizer, pesticide, INP, SOIL]
    indicator_families:
      - id: land_input_grain
        filters: "Always filter input_grain before SUM/AVG"
    business_questions_supported:
      - What is fertilizer or pesticide use by country and year?
      - Land input intensity for a crop/item
    filtering_guidance:
      - Always filter input_grain — one fact covers land use, fertilizer, pesticide, and related grains
      - Prefer this table over fct_fertilizer / fct_pesticide when unified inputs are available
      - Filter country_iso3 + year; JOIN dim_item / dim_element for item and element labels via spine
      - Never filter place_scope ARRAY with =
    sql_generation_hints:
      - Filter input_grain first; then item_key/element_key via dim_item.item_name / dim_element.element_name
      - LEFT JOIN dim_geography on geography_key for country names
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}
        - {table: dim_item, on: [item_key], how: LEFT}
        - {table: dim_element, on: [element_key], how: LEFT}
      do_not_join:
        - {table: fct_fertilizer, reason: Prefer fct_land_inputs with input_grain filter}

  agg_hdi_latest:
    indicator_classes: [HDI]
    semantic_role:
      primary_domain: hdi
      supports: [hdi, HDI]
    business_questions_supported:
      - What is the latest HDI for a country?
    filtering_guidance:
      - Latest year per country only — not a time series
      - Prefer over fct_hdi for current/snapshot HDI questions
      - Use fct_hdi when the question asks for trends or multi-year history
      - Filter country_name / country_iso3; skip null geography_key when mapping
    sql_generation_hints:
      - LEFT JOIN dim_geography on geography_key for country labels
      - One row per country — no year range filter needed for snapshots
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}

  fct_food_hazards:
    indicator_classes: [AH]
    semantic_role:
      primary_domain: food_security
      supports: [food_hazards, food_safety, AH]
    business_questions_supported:
      - Which foodborne hazards appear in study sites?
      - Hazard prevalence by country when geo is available
    filtering_guidance:
      - Study × site × hazard × year grain — sparse geo; do not invent country coverage
      - JOIN dim_disease for hazard labels; never invent disease_or_hazard literals
      - Filter disease_key via spine / dim samples; use foodborne_hazard column when denormalized
    sql_generation_hints:
      - disease_key IN (SELECT disease_key FROM dim_disease WHERE disease_or_hazard = ...)
      - LEFT JOIN dim_geography on geography_key when country is known
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}
        - {table: dim_disease, on: [disease_key], how: LEFT}

  fct_insurance:
    indicator_classes: [AH]
    semantic_role:
      primary_domain: household
      supports: [insurance, livestock_insurance, AH]
    business_questions_supported:
      - Livestock insurance uptake by household or country
    filtering_guidance:
      - Household insurance record grain — not national census
      - JOIN dim_household for household attributes; filter metric and record_type when present
      - Geo coverage may be weak — do not invent admin coverage
    sql_generation_hints:
      - LEFT JOIN dim_household on household_key; LEFT JOIN dim_geography on geography_key
      - Filter metric / record_type from YAML samples — never invent values
    semantic_relationships:
      joins_with:
        - {table: dim_geography, on: [geography_key], how: LEFT}
        - {table: dim_household, on: [household_key], how: LEFT}

  agg_prices_country_month:
    indicator_classes: [PRC]
    semantic_role:
      primary_domain: prices
      supports: [prices, market_price, PRC]
    business_questions_supported:
      - What is the national monthly price for a crop?
    filtering_guidance:
      - Prefer for country-month price rollups over market-level fct_prices
      - Do not blend price_source rows in one SUM/AVG
      - Filter country_iso3 + year/month; JOIN dim_product for crop labels
    sql_generation_hints:
      - Filter price_source first when comparing FEWS/WFP/FAOSTAT
      - LEFT JOIN dim_geography / dim_product on spine keys

  fct_emissions:
    indicator_classes: [ENV]
    semantic_role:
      primary_domain: emissions
      supports: [emissions, ghg, ENV]
    business_questions_supported:
      - Agricultural GHG emissions by country and item
    filtering_guidance:
      - Filter item/element via spine (dim_item / dim_element) — do not invent element labels
      - Filter country_iso3 + year; never invent emission category literals
    sql_generation_hints:
      - item_key / element_key IN (SELECT … FROM dim_item / dim_element WHERE name = …)
      - LEFT JOIN dim_geography on geography_key for country names

  fct_soil_health:
    indicator_classes: [SOIL]
    semantic_role:
      primary_domain: soil
      supports: [soil_health, SOIL]
    business_questions_supported:
      - Soil property values at point or plot grain
    filtering_guidance:
      - Point / plot grain — prefer agg_soil_admin for admin or country OTAs
      - Filter soil_property_key via dim_soil_property samples; compare source_key carefully
      - Never average across iSDA vs ISRIC without stating source
    sql_generation_hints:
      - Prefer agg_soil_admin for national/admin rollups
      - JOIN dim_soil_property / dim_geography via spine

  agg_soil_admin:
    indicator_classes: [SOIL]
    semantic_role:
      primary_domain: soil
      supports: [soil_health, SOIL]
    business_questions_supported:
      - Admin-level soil property rollups for a country
    filtering_guidance:
      - Admin rollup companion to fct_soil_health — prefer for country/admin OTAs
      - Filter country_iso3 / admin labels; do not invent soil property literals
    sql_generation_hints:
      - LEFT JOIN dim_geography on geography_key; filter soil property via spine

  fct_animal_health:
    indicator_classes: [AH]
    semantic_role:
      primary_domain: animal_health
      supports: [animal_health, livestock, AH]
    business_questions_supported:
      - Livestock disease or health indicators from survey grain
    filtering_guidance:
      - Survey grain — JOIN dim_livestock / dim_household; do not treat as national census
      - Filter livestock_key / disease_key via spine samples; never invent species labels
    sql_generation_hints:
      - LEFT JOIN dim_livestock on livestock_key; LEFT JOIN dim_household when present

  fct_machinery:
    indicator_classes: [INP]
    semantic_role:
      primary_domain: production
      supports: [machinery, land_inputs, INP]
    filtering_guidance:
      - INP companion to fct_land_inputs — filter item/element via spine
      - Prefer fct_land_inputs when unified input_grain covers the question

  agg_emissions_country_year:
    indicator_classes: [ENV]
    semantic_role:
      primary_domain: emissions
      supports: [emissions, ENV]
    filtering_guidance:
      - National emissions panel — prefer for country-year GHG rollups
      - Filter country_iso3 + year; do not invent element labels

  agg_food_security_country_month:
    indicator_classes: [FS]
    semantic_role:
      primary_domain: food_security
      supports: [food_security, ipc, FS]
    filtering_guidance:
      - FS companion to agg_food_security_monthly — country-month IPC rollups
      - Filter measure_type; do not blend population vs classification

  fct_forestry:
    indicator_classes: [ENV]
    semantic_role:
      primary_domain: forestry
      supports: [forestry, ENV]
    filtering_guidance:
      - Filter item/element via spine — not product_key
      - JOIN dim_item / dim_element for labels; never invent forestry item literals

  agg_food_security_monthly:
    indicator_classes: [FS]
    semantic_role:
      primary_domain: food_security
      supports: [food_security, ipc, FS]
    filtering_guidance:
      - Country monthly IPC rollups; filter measure_type

  dim_geography:
    indicator_classes: []
    semantic_role:
      primary_domain: geography
      supports: [geography, join_dim]
    filtering_guidance:
      - Join on geography_key / geo_key — expose place grain, not country labels only
      - Filter geo_level when asking country vs admin1/admin2/city/fnid
      - Prefer admin_1_name / admin_2_name / city_name samples for subnational questions
      - SELECT population, latitude, longitude, parent_geography_key when place context helps
      - Never filter geography_key / geo_key with hash literals
    sql_generation_hints:
      - LEFT JOIN dim_geography g ON f.geography_key = g.geography_key (or f.geo_key = g.geography_key)
      - SELECT g.geo_level, g.country_iso3, g.country_name, g.admin_1_name, g.admin_2_name, g.city_name, g.population
      - Filter country_iso3 for national; AND admin/city columns from YAML samples only

  dim_product:
    indicator_classes: []
    semantic_role:
      primary_domain: product
      supports: [product, join_dim]
    sql_generation_hints:
      - Join target for product_name labels on product_key

  dim_indicator:
    indicator_classes: [EL, CLIM, RES]
    semantic_role:
      primary_domain: indicator
      supports: [indicator, join_dim, EL, CLIM, RES]
    filtering_guidance:
      - Lookup table for indicator_name; join on indicator_key from facts
    sql_generation_hints:
      - LEFT JOIN dim_indicator i ON f.indicator_key = i.indicator_key; filter i.indicator_name

  dim_source:
    indicator_classes: []
    semantic_role:
      primary_domain: source
      supports: [source, join_dim]

  dim_market:
    indicator_classes: [PRC]
    semantic_role:
      primary_domain: market
      supports: [market, prices, join_dim]
