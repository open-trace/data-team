sql_generation_hints:
- LEFT JOIN dim_geography g ON f.geography_key = g.geography_key (or f.geo_key = g.geography_key)
- SELECT g.geo_level, g.country_iso3, g.country_name, g.admin_1_name, g.admin_2_name,
  g.city_name, g.population
- Filter country_iso3 for national; AND admin/city columns from YAML samples only
filtering_guidance:
- Join on geography_key / geo_key — expose place grain, not country labels only
- Filter geo_level when asking country vs admin1/admin2/city/fnid
- Prefer admin_1_name / admin_2_name / city_name samples for subnational questions
- SELECT population, latitude, longitude, parent_geography_key when place context
  helps
- Never filter geography_key / geo_key with hash literals
