filtering_guidance:
- Study × site × hazard × year grain — sparse geo; do not invent country coverage
- JOIN dim_disease for hazard labels; never invent disease_or_hazard literals
- Filter disease_key via spine / dim samples; use foodborne_hazard column when denormalized
semantic_role:
  primary_domain: food_security
  supports:
  - food_hazards
  - food_safety
  - AH
sql_generation_hints:
- disease_key IN (SELECT disease_key FROM dim_disease WHERE disease_or_hazard = ...)
- LEFT JOIN dim_geography on geography_key when country is known
bind_spine:
  geography_key: dim_geography.country_iso3
  source_key: dim_source.organisation_name
  disease_key: dim_disease.disease_or_hazard
semantic_relationships:
  joins_with:
  - table: dim_geography
    true:
    - geography_key
    how: LEFT
  - table: dim_disease
    true:
    - disease_key
    how: LEFT
business_questions_supported:
- Which foodborne hazards appear in study sites?
- Hazard prevalence by country when geo is available
indicator_classes:
- AH
