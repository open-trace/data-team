semantic_relationships:
  joins_with:
  - table: dim_geography
    true:
    - geography_key
    how: LEFT
  - table: dim_product
    true:
    - product_key
    how: LEFT
  do_not_join:
  - table: fct_yield
    reason: Different grain — compare only
filtering_guidance:
- Always filter production_grain — never mix physical, index, gross_value in one SUM
- Default volume questions to production_grain='physical'
- Filter country_iso3 or join dim_geography for country names; never filter place_scope
  ARRAY with =
- Filter as_of_date or year for time-bounded questions
- Prefer metric slug when present; else filter element exactly
- Never UNION with fct_yield — different grain
business_questions_supported:
- What is national crop production by country and year?
- Which country produced the most maize in a given year?
semantic_role:
  primary_domain: production
  supports:
  - production
  - faostat
  - PROD
indicator_classes:
- PROD
indicator_families:
- id: faostat_country_year_physical
  filters: production_grain='physical'; filter metric or element for volume
- id: faostat_index_gross_value
  filters: production_grain in ('index','gross_value')
sql_generation_hints:
- 'National ranking: production_grain=''physical''; GROUP BY country_iso3, year; SUM(production_qty)
  or value column'
- LEFT JOIN dim_geography g ON f.geography_key = g.geography_key WHEN filtering by
  country name
- Prefer agg_production_annual for national annual rollups
bind_spine:
  geography_key: dim_geography.country_iso3
  product_key: dim_product.product_name
  source_key: dim_source.organisation_name
  element_key: dim_element.element_name
  season_key: dim_season.season_name
