filtering_guidance:
- Always filter input_grain — one fact covers land use, fertilizer, pesticide, and
  related grains
- Prefer this table over fct_fertilizer / fct_pesticide when unified inputs are available
- Filter country_iso3 + year; JOIN dim_item / dim_element for item and element labels
  via spine
- Never filter place_scope ARRAY with =
semantic_role:
  primary_domain: production
  supports:
  - land_inputs
  - fertilizer
  - pesticide
  - INP
  - SOIL
sql_generation_hints:
- Filter input_grain first; then item_key/element_key via dim_item.item_name / dim_element.element_name
- LEFT JOIN dim_geography on geography_key for country names
bind_spine:
  geography_key: dim_geography.country_iso3
  source_key: dim_source.organisation_name
  item_key: dim_item.item_name
  element_key: dim_element.element_name
semantic_relationships:
  joins_with:
  - table: dim_geography
    true:
    - geography_key
    how: LEFT
  - table: dim_item
    true:
    - item_key
    how: LEFT
  - table: dim_element
    true:
    - element_key
    how: LEFT
  do_not_join:
  - table: fct_fertilizer
    reason: Prefer fct_land_inputs with input_grain filter
business_questions_supported:
- What is fertilizer or pesticide use by country and year?
- Land input intensity for a crop/item
indicator_families:
- id: land_input_grain
  filters: Always filter input_grain before SUM/AVG
indicator_classes:
- INP
- SOIL
