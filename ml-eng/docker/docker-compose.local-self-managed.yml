# Local dev: self-managed Qdrant + RAG API
#
# Usage:
#   cd ml-eng
#   cp config/.env.example .env  # fill in LLM + GCP vars
#   docker compose -f docker/docker-compose.local-self-managed.yml up --build
#
# API:    http://localhost:7860
# Qdrant: http://localhost:6333  (dashboard: http://localhost:6333/dashboard)
#
# Mirrors the Railway self-managed layout (qdrant service + rag-api on private net).

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-api:
    build:
      context: ..
      dockerfile: Dockerfile.railway
    image: opentrace-rag-api:railway-local
    ports:
      - "${RAG_API_PORT:-7860}:7860"
    environment:
      # Self-managed Qdrant (compose internal hostname)
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT_COLLECTION_NEWS: ${QDRANT_COLLECTION_NEWS:-news_data}
      QDRANT_COLLECTION_ACADEMIC_PAPERS: ${QDRANT_COLLECTION_ACADEMIC_PAPERS:-academic_papers}
      QDRANT_COLLECTION_POLICIES: ${QDRANT_COLLECTION_POLICIES:-policies}
      QDRANT_COLLECTION_PUBLIC_REPORTS: ${QDRANT_COLLECTION_PUBLIC_REPORTS:-public_reports}
      QDRANT_COLLECTION_FORMATION: ${QDRANT_COLLECTION_FORMATION:-formation}
      QDRANT_COLLECTION_OTA_INSIGHTS: ${QDRANT_COLLECTION_OTA_INSIGHTS:-OTA_insights}
      # LLM
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:?set RAG_LLM_API_KEY in .env}
      RAG_LLM_MODEL_ID: ${RAG_LLM_MODEL_ID:-qwen/qwen3-30b-a3b-instruct-2507}
      RAG_BQ_NL2SQL_MODEL_ID: ${RAG_BQ_NL2SQL_MODEL_ID:-deepseek/deepseek-v4-flash-0731}
      # GCP / BigQuery
      BQ_PROJECT: ${BQ_PROJECT:-}
      BQ_DATASET_GOLD: ${BQ_DATASET_GOLD:-mart_dev}
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${GOOGLE_APPLICATION_CREDENTIALS_BASE64:-}
      # Reranker (baked into Railway image)
      RAG_RERANKER_MODE: cross_encoder
      RAG_RERANKER_MODEL: BAAI/bge-reranker-base
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant-storage:
